name: Publish draft previews

# Publishes ONLY the two single-file draft previews (mockups/offline) to GitHub
# Pages. The website itself is never built or deployed by this workflow.

on:
  push:
    branches:
      - arena/f5dd0ec5-ballooncreationelite
    paths:
      - "mockups/offline/*.html"
      - "mockups/drafts-site/**"
      - ".github/workflows/publish-drafts.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drafts-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish drafts
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble the drafts site
        run: |
          mkdir -p _site
          cp mockups/offline/decor-types-draft-offline.html _site/draft-english.html
          cp mockups/offline/decor-types-draft-offline-hinglish.html _site/draft-hinglish.html
          cp mockups/drafts-site/index.html _site/index.html
          touch _site/.nojekyll
          ls -la _site

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the drafts
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
